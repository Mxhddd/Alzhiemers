# Module 1 — drug-target Mendelian randomization (PROJECT_BRIEF.md §5).
# Estimator and harmonisation settings live in config/mr_methods.yaml (shared
# with the validation test). This file holds data sources, instrument rules
# and the pre-registered targets.
#
# `null` means "the researcher must supply this". The pipeline stops with a
# message naming the field; it never substitutes a value.

# Seed for every random step in the module (weighted-median bootstrap uses
# mr_methods.yaml's seed; this one covers anything module-level).
seed: 20261014

# Every input file must be on this build. Bellenguez 2022 stage 1 on the GWAS
# Catalog is GRCh37 (brief §5); exposures must match or the run stops.
genome_build: GRCh37

outcome:
  # Bellenguez et al. 2022, stage 1 discovery (includes UK Biobank proxy cases).
  gwas_catalog_id: GCST90027158
  # RESEARCHER: path under data/raw/ after download (see `make mr-download-help`).
  file: null
  # RESEARCHER: map our names -> the file's column headers (loader checks each).
  columns: null
  # Outcome type decides the coloc prior and the Steiger r^2 formula.
  type: case_control
  # RESEARCHER: total cases and controls (for Steiger r^2 and coloc).
  n_cases: null
  # RESEARCHER
  n_controls: null
  # Sensitivity analysis without UK Biobank proxy cases (brief §5). RESEARCHER:
  # a proxy-free summary-statistics file if one exists; null = analysis is
  # reported as "not run: no proxy-free file supplied".
  proxy_free_file: null

# FinnGen public Alzheimer's endpoint for replication. RESEARCHER: endpoint
# name, release and file; null = replication reported as not run.
replication:
  # RESEARCHER: e.g. a FinnGen release and endpoint code
  finngen_endpoint: null
  # RESEARCHER
  file: null
  # RESEARCHER
  columns: null
  # RESEARCHER
  n_cases: null
  # RESEARCHER
  n_controls: null

exposures:
  eqtlgen:
    # Blood cis-eQTLs (eQTLGen). Z-scores only: beta and SE are derived from
    # Z, allele frequency and N (Zhu et al. 2016) in fetch_exposure().
    tissue: blood
    # RESEARCHER: path under data/raw/
    file: null
    # RESEARCHER: separate allele-frequency file eQTLGen distributes
    allele_frequency_file: null
    # RESEARCHER: column mapping (loader checks every name exists)
    columns: null
    # Must match genome_build above.
    build: GRCh37
  metabrain:
    # Cortex cis-eQTLs (MetaBrain). RESEARCHER: file, columns, build.
    tissue: cortex
    # RESEARCHER
    file: null
    # RESEARCHER
    columns: null
    # RESEARCHER: MetaBrain release build — must match genome_build or be lifted over first
    build: null
  pqtl:
    # UKB-PPP / deCODE cis-pQTLs where available. RESEARCHER: file, columns, build.
    tissue: plasma
    # RESEARCHER
    file: null
    # RESEARCHER
    columns: null
    # RESEARCHER: UKB-PPP is distributed on GRCh38 — needs liftover to GRCh37 first
    build: null

instruments:
  # Genome-wide significance for cis instruments. A choice (brief left it
  # open): 5e-8 is the conservative convention; looser thresholds add weak
  # instruments and Module 1 already has F > 10 as a separate filter.
  p_max: 5.0e-8
  # Brief §5: minimum per-variant F statistic.
  f_stat_min: 10
  # Brief §5: minimum minor-allele frequency.
  maf_min: 0.01
  # Brief §5: LD clumping r^2 threshold (near-independent instruments).
  ld_r2_max: 0.001
  # Brief §5: LD clumping window, kb.
  ld_window_kb: 10000
  # RESEARCHER: PLINK binary fileset (without extension) of the LD reference
  # panel, e.g. 1000 Genomes EUR on GRCh37. Needed for clumping.
  ld_reference_bfile: null

coloc:
  # Brief §5: colocalisation supported if PP4 >= this.
  pp4_min: 0.8
  # Prior probability a variant is associated with trait 1 / trait 2
  # (coloc defaults, Giambartolomei 2014).
  p1: 1.0e-4
  # Same as p1.
  p2: 1.0e-4
  # Prior for a shared causal variant. 5e-6 rather than the coloc default
  # 1e-5, following Wallace 2020 (PLoS Genet) who showed 1e-5 is too permissive.
  p12: 5.0e-6
  # Prior SD of effect sizes (Wakefield ABF): 0.15 for a standardised
  # quantitative trait (eQTL), 0.2 for log-OR of a case-control trait — the
  # coloc package defaults.
  prior_sd_quantitative: 0.15
  # See prior_sd_quantitative.
  prior_sd_case_control: 0.2

# Sensitivity analysis: every target re-run with this cis window (eQTLGen's
# own cis definition is +/-1 Mb). Decided 2026-10-13; see window_kb above.
window_kb_sensitivity: 1000

positive_control:
  # A positive-control MR passes if p < this AND the sign matches expectation.
  # 0.05 is a choice: the control is a sanity check of instrument function,
  # not a discovery, so no multiple-testing correction.
  p_max: 0.05

# Pre-registered targets (brief §5 table). `predicted_lower_activity` is copied
# from the brief. Expression eQTLs are oriented to the expression-INCREASING
# allele, so "lower activity protective" means a POSITIVE MR estimate (higher
# expression -> higher AD risk); the code derives the expected sign.
# window_kb: cis window either side of the gene body. DECIDED 2026-10-13:
# +/-100 kb primary - most cis-eQTL/pQTL effects lie within 100 kb of the gene,
# and a narrow window keeps neighbouring genes' variants (pleiotropy) out; the
# eQTLGen cis definition (+/-1 Mb) is the sensitivity analysis
# (window_kb_sensitivity below). The brief asked for a per-target window, so
# each target can be changed individually.
# positive_control: outcome trait the instrument must move, with the expected
# sign of the MR estimate per higher expression, and the researcher-supplied
# summary statistics. A target with no positive control is EXCLUDED (the brief
# makes the control a hard gate) and the exclusion is logged.
targets:
  SLC6A2:
    # Noradrenaline transporter — atomoxetine.
    predicted_lower_activity: protective
    # Choice, see block comment above.
    window_kb: 100
    positive_control:
      # Decided 2026-10-13. NET inhibition (atomoxetine) raises heart rate, so lower SLC6A2 activity -> higher HR and higher expression -> LOWER HR (sign -1). The GWAS Catalog shows no genome-wide SLC6A2-heart-rate signal (manuscript/notes/mr_positive_controls.md), so this control may fail and exclude the target - that is the gate working.
      trait: resting_heart_rate
      # Expected sign of the MR estimate per HIGHER expression (see the comment above).
      expected_sign: -1
      # Summary statistics not yet downloaded (Module 1 data step); null = control not run, target excluded.
      file: null
      # Column mapping for that file (Module 1 data step).
      columns: null
      # Trait type (decides the coloc prior and Steiger formula).
      type: quantitative
      # Sample size of the control GWAS (Module 1 data step).
      n: null
  ADRB1:
    # Beta-1 adrenergic receptor — lipophilic beta-blockers.
    predicted_lower_activity: protective
    # Choice, see block comment above.
    window_kb: 100
    positive_control:
      # Brief §6, Session 2 gate: the instrument must move resting heart rate.
      trait: resting_heart_rate
      # Beta-blockade lowers heart rate, so higher ADRB1 expression should raise it.
      expected_sign: 1
      # RESEARCHER: resting heart rate GWAS file under data/raw/
      file: null
      # RESEARCHER
      columns: null
      # Resting heart rate is quantitative.
      type: quantitative
      # RESEARCHER: sample size
      n: null
  ADRA1A:
    # Alpha-1A receptor — prazosin, doxazosin.
    predicted_lower_activity: protective
    # Choice, see block comment above.
    window_kb: 100
    positive_control:
      # Decided 2026-10-13. Alpha1 blockade lowers blood pressure, so higher ADRA1A expression -> higher DBP (sign +1). GWAS Catalog: DBP at ADRA1A, p = 7e-9 (Keaton 2024, GCST90310295).
      trait: diastolic_blood_pressure
      # Expected sign of the MR estimate per HIGHER expression (see the comment above).
      expected_sign: 1
      # Summary statistics not yet downloaded (Module 1 data step); null = control not run, target excluded.
      file: null
      # Column mapping for that file (Module 1 data step).
      columns: null
      # Trait type (decides the coloc prior and Steiger formula).
      type: quantitative
      # Sample size of the control GWAS (Module 1 data step).
      n: null
  ADRA2A:
    # Alpha-2A autoreceptor — guanfacine (agonist). Lower activity = loss of restraint.
    predicted_lower_activity: harmful
    # Choice, see block comment above.
    window_kb: 100
    positive_control:
      # Decided 2026-10-13. ADRA2A over-expression impairs insulin secretion (Rosengren 2010, Science, PMID 19965390), so higher expression -> higher glucose (sign +1). GWAS Catalog: 12 genome-wide glucose associations at ADRA2A, min p 7e-39 (GCST90468071); T2D p 2e-15 (GCST90492734).
      trait: fasting_glucose
      # Expected sign of the MR estimate per HIGHER expression (see the comment above).
      expected_sign: 1
      # Summary statistics not yet downloaded (Module 1 data step); null = control not run, target excluded.
      file: null
      # Column mapping for that file (Module 1 data step).
      columns: null
      # Trait type (decides the coloc prior and Steiger formula).
      type: quantitative
      # Sample size of the control GWAS (Module 1 data step).
      n: null
  LGMN:
    # Asparagine endopeptidase (legumain) — no human drug yet.
    predicted_lower_activity: protective
    # Choice, see block comment above.
    window_kb: 100
    # UNTESTABLE (decided 2026-10-13): no trait mechanistically downstream of legumain activity has a genome-wide signal at LGMN; the only strong signals are legumain protein itself and unrelated proteins (manuscript/notes/mr_positive_controls.md). null = excluded and reported as untestable with current instruments, not as a null result.
    positive_control: null
  SLC18A2:
    # VMAT2.
    predicted_lower_activity: harmful
    # Choice, see block comment above.
    window_kb: 100
    # UNTESTABLE (decided 2026-10-13): the 6 GWAS Catalog signals at SLC18A2 (blood proteins, ghrelin, glucose) do not index VMAT2 function. null = excluded and reported as untestable, not as a null result.
    positive_control: null
  MAOA:
    # Monoamine oxidase A — X-linked; may be absent from summary files (checked and reported).
    predicted_lower_activity: protective
    # Choice, see block comment above.
    window_kb: 100
    # UNTESTABLE (decided 2026-10-13): X-linked; one GWAS Catalog association, none genome-wide. null = excluded and reported as untestable, not as a null result.
    positive_control: null
  DBH:
    # Dopamine beta-hydroxylase — disulfiram, nepicastat. Direction not pre-specified.
    predicted_lower_activity: exploratory
    # Choice, see block comment above.
    window_kb: 100
    positive_control:
      # Decided 2026-10-13. DBH makes noradrenaline; lower DBH -> less NE -> lower BP, so higher expression -> higher SBP (sign +1). GWAS Catalog: SBP at DBH min p 8e-21 (Keaton 2024, GCST90310294). The target's AD direction stays exploratory.
      trait: systolic_blood_pressure
      # Expected sign of the MR estimate per HIGHER expression (see the comment above).
      expected_sign: 1
      # Summary statistics not yet downloaded (Module 1 data step); null = control not run, target excluded.
      file: null
      # Column mapping for that file (Module 1 data step).
      columns: null
      # Trait type (decides the coloc prior and Steiger formula).
      type: quantitative
      # Sample size of the control GWAS (Module 1 data step).
      n: null
  CACNA1D:
    # Cav1.3 — isradipine.
    predicted_lower_activity: protective
    # Choice, see block comment above.
    window_kb: 100
    positive_control:
      # Decided 2026-10-13. Calcium-channel blockade lowers BP, so higher Cav1.3 expression -> higher SBP (sign +1). GWAS Catalog: SBP at CACNA1D min p 2e-38 (Jee 2025, GCST90662908).
      trait: systolic_blood_pressure
      # Expected sign of the MR estimate per HIGHER expression (see the comment above).
      expected_sign: 1
      # Summary statistics not yet downloaded (Module 1 data step); null = control not run, target excluded.
      file: null
      # Column mapping for that file (Module 1 data step).
      columns: null
      # Trait type (decides the coloc prior and Steiger formula).
      type: quantitative
      # Sample size of the control GWAS (Module 1 data step).
      n: null
  HCRTR2:
    # Orexin receptor 2 — suvorexant, lemborexant. Exploratory.
    predicted_lower_activity: exploratory
    # Choice, see block comment above.
    window_kb: 100
    positive_control:
      # Decided 2026-10-13. Orexin-receptor antagonists lengthen sleep, so higher HCRTR2 expression -> SHORTER sleep (sign -1). GWAS Catalog: sleep duration at HCRTR2 p 6e-11 (Dashti 2019, GCST007561); chronotype p 3e-48.
      trait: sleep_duration
      # Expected sign of the MR estimate per HIGHER expression (see the comment above).
      expected_sign: -1
      # Summary statistics not yet downloaded (Module 1 data step); null = control not run, target excluded.
      file: null
      # Column mapping for that file (Module 1 data step).
      columns: null
      # Trait type (decides the coloc prior and Steiger formula).
      type: quantitative
      # Sample size of the control GWAS (Module 1 data step).
      n: null
