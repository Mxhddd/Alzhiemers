# Module 1 — drug-target Mendelian randomization (PROJECT_BRIEF.md §5).
# Estimator and harmonisation settings live in config/mr_methods.yaml (shared
# with the validation test). This file holds data sources, instrument rules
# and the pre-registered targets.
#
# `null` means "the researcher must supply this". The pipeline stops with a
# message naming the field; it never substitutes a value.

# Seed for every random step in the module (weighted-median bootstrap uses
# mr_methods.yaml's seed; this one covers anything module-level).
seed: 20261014

# Every input file must be on this build. Bellenguez 2022 stage 1 on the GWAS
# Catalog is GRCh37 (brief §5); exposures must match or the run stops.
genome_build: GRCh37

outcome:
  # Bellenguez et al. 2022, stage 1 discovery (includes UK Biobank proxy cases).
  gwas_catalog_id: GCST90027158
  # Data step 2026-10-15: downloaded, QUARANTINED and NOT READ, to
  # data/raw/mr/quarantine_outcome/GCST90027158/GCST90027158_buildGRCh38.tsv.gz
  # (sha256 in data/raw/mr/MANIFEST.tsv). The GWAS Catalog file is on GRCh38
  # (file name and its -meta.yaml "genome_assembly: GRCh38"), NOT GRCh37 as
  # brief §5 assumed, so it must be lifted to GRCh37 (src/mr/liftover.py)
  # before use - and lifting means reading its rows, which must wait until
  # prereg/mr.md is frozen. Left null so nothing can read it before then.
  file: null
  # Our names -> the file's headers, from its header line only (2026-10-15).
  # variant_id holds rsIDs per the GWAS-SSF convention (not checked: rows unread).
  columns:
    SNP: variant_id  # rsID (harmonisation key)
    chrom: chromosome  # GRCh38 in the raw file; GRCh37 after liftover
    pos: base_pair_location  # GRCh38 in the raw file; GRCh37 after liftover
    effect_allele: effect_allele  # file header
    other_allele: other_allele  # file header
    eaf: effect_allele_frequency  # file header
    beta: beta  # log-OR (file header)
    se: standard_error  # file header
    p: p_value  # file header
  # Outcome type decides the coloc prior and the Steiger r^2 formula.
  type: case_control
  # GWAS Catalog REST API v2, study GCST90027158 (2026-10-15): "39,106 European
  # ancestry clinically diagnosed cases, 46,828 European ancestry proxy cases,
  # 401,577 European ancestry controls"; 39,106 + 46,828 = 85,934 (all cases
  # in the stage-1 file, proxy cases included). Total 487,511 matches the
  # file's -meta.yaml sample_size.
  n_cases: 85934
  # Same source as n_cases.
  n_controls: 401577
  # Sensitivity analysis without UK Biobank proxy cases (brief §5). Data step
  # 2026-10-15: Kunkle et al. 2019 stage 1 (GCST007511, clinically diagnosed,
  # 21,982 cases / 41,944 controls per GWAS Catalog API) is downloaded and
  # QUARANTINED, not read, at
  # data/raw/mr/quarantine_outcome/GCST007511/Kunkle_etal_Stage1_results.txt.
  # Its header (line 1 only) is "Chromosome Position MarkerName Effect_allele
  # Non_Effect_allele Beta SE Pvalue": no allele-frequency column, and run_mr.R
  # reads it with outcome.columns above, which do not match. It needs a
  # reformatted copy with an EAF (e.g. from 1000G EUR) - row-level work that
  # must wait for the freeze. Left null = "not run: no proxy-free file supplied".
  proxy_free_file: null

# FinnGen public Alzheimer's endpoint for replication.
replication:
  # Decision 2026-10-21: the release current at run time (prereg section 4) is
  # R13, and its files are downloadable without an account (public Google
  # Cloud bucket finngen-public-data-r13, anonymous listing and download; the
  # finngen.fi access page, which describes an access form, refused automated
  # access and was not read). Endpoint G6_ALZHEIMER, the one the
  # pre-registration names, so no substitution. R13 G6_ALZHEIMER downloaded
  # 2026-10-21 from
  # https://storage.googleapis.com/finngen-public-data-r13/summary_stats/finngen_R13_G6_ALZHEIMER.gz
  # (805,395,928 bytes; sha256 9cfdf75f996ca688eb9de4638fa0dc5249b102c8e65da0423769b5ce4324e8eb;
  # md5 equals the bucket's md5Hash) to
  # data/raw/mr/quarantine_outcome/finngen_R13_G6_ALZHEIMER/ and QUARANTINED:
  # only its header line was read. The R10 file was deleted the same day (the
  # researcher said R10 is not needed). FinnGen is GRCh38: the copy is lifted
  # to GRCh37 (src/mr/liftover.py) after prereg/mr.md is frozen. Null until then.
  release: R13
  finngen_endpoint: G6_ALZHEIMER  # see above
  file: null  # null until the freeze (lifting reads rows)
  # From the R13 file's header line only (2026-10-21): "#chrom pos ref alt
  # rsids nearest_genes pval mlogp beta sebeta af_alt af_alt_cases
  # af_alt_controls" (same as R10). FinnGen's beta and af are for the alt allele.
  columns:
    SNP: rsids  # rsID (can hold several comma-separated ids; check after the freeze)
    # GRCh38 in the raw file; GRCh37 after liftover (header really is "#chrom")
    chrom: "#chrom"
    pos: pos  # GRCh38 in the raw file; GRCh37 after liftover
    effect_allele: alt  # FinnGen effects are for the alt allele
    other_allele: ref  # reference allele
    eaf: af_alt  # alt-allele frequency
    beta: beta  # log-OR for alt
    se: sebeta  # file header
    p: pval  # file header
  # Official FinnGen R13 manifest
  # (https://storage.googleapis.com/finngen-public-data-r13/summary_stats/finngen_R13_manifest.tsv,
  # the link given in the FinnGen documentation; downloaded 2026-10-21 to
  # data/raw/mr/finngen_r13/finngen_R13_manifest.tsv, sha256
  # c9caafa9b98ee5ef050a705766bd1c451fc2154fb8e81b069022012a2f75ae20), row
  # G6_ALZHEIMER "Alzheimer disease": num_cases 16652.
  n_cases: 16652
  # Same manifest row: num_controls 483534.
  n_controls: 483534

exposures:
  eqtlgen:
    # Blood cis-eQTLs (eQTLGen). Z-scores only: beta and SE are derived from
    # Z, allele frequency and N (Zhu et al. 2016) in fetch_exposure().
    tissue: blood
    # Data step 2026-10-15. Derived by src/mr/prepare_inputs.py from the eQTLGen
    # full cis-eQTL file (data/raw/mr/eqtlgen/2019-12-11-cis-eQTLsFDR-ProbeLevel-
    # CohortInfoRemoved-BonferroniAdded.txt.gz, molgenis26.gcc.rug.nl, 3.9 GB):
    # all rows for the target genes (+ HMGCR), original columns kept, with the
    # assessed-allele frequency joined from allele_frequency_file. eQTLGen
    # tested 19,250 blood-expressed autosomal genes: SLC6A2, ADRA1A, MAOA and
    # HCRTR2 are NOT among them (checked by symbol and Ensembl ID).
    file: data/interim/mr/eqtlgen_cis_targets_with_eaf.tsv
    # eQTLGen 2018-07-18 AF file (AlleleB = assessed allele; AF from all cohorts except FHS, per its README).
    allele_frequency_file: data/raw/mr/eqtlgen/2018-07-18_SNP_AF_for_AlleleB_combined_allele_counts_and_MAF_pos_added.txt.gz
    # Our names -> headers (eQTLGen README_cis; AssessedAllele_freq is added by prepare_inputs.py).
    columns:
      SNP: SNP  # rsID
      chrom: SNPChr  # hg19 (README; prepare_inputs.py checks it equals the AF file's hg19_chr/pos)
      pos: SNPPos  # hg19
      effect_allele: AssessedAllele  # "the Z-score refers to this allele" (README)
      other_allele: OtherAllele  # README
      eaf: AssessedAllele_freq  # joined from allele_frequency_file by rsID with an allele check
      z: Zscore  # beta/SE derived from Z, eaf and N in sumstats.R (Zhu 2016)
      "n": NrSamples  # per SNP-gene pair. Key quoted: R yaml reads a bare `n` key as FALSE (YAML 1.1 boolean)
      p: Pvalue  # README
      gene: GeneSymbol  # HGNC symbol (Ensembl v71 per README)
    # Must match genome_build above.
    build: GRCh37
  metabrain:
    # Brain (cortex) cis-eQTLs: MetaBrain, de Klein et al. 2023 Nat Genet
    # (doi 10.1038/s41588-023-01300-6), Cortex-EUR (n = 2,683). Decision
    # 2026-10-21 (option b). ACCESS: the full cis-eQTL summary statistics need a
    # Google form (name, e-mail, institute, intended use; link e-mailed back) -
    # "needs the researcher", not downloaded. What IS open (no account, no form,
    # website terms of use only: no redistribution, cite, no re-identification):
    # the significant cis-eQTL table behind the public browser
    # (www.metabrain.nl/cis-eqtls.html, served by
    # https://eqtlgen.molgeniscloud.org/api/v2/metabrain_cis_eqtl_v2; 56,894 rows,
    # downloaded 2026-10-21 to data/raw/mr/metabrain_deklein2023/). That table
    # holds only the top variant of each conditional round (QTLRank) per gene, so
    # it is used as follows (src/mr/prepare_qtl_sources.py):
    #  - Cortex-EUR rows only (the ancestry of the outcome GWAS; Cortex is the
    #    tissue named in the pre-registration);
    #  - QTLRank 1 only: rank >= 2 effects are conditional on the earlier ranks,
    #    and mixing conditional exposure effects with marginal outcome effects is
    #    not valid; rank 1 is the marginal top variant;
    #  - GRCh38 positions lifted to GRCh37 with src/mr/liftover.py (drops logged);
    #  - no allele frequency in the table: eaf = 1000 Genomes EUR frequency of the
    #    effect allele, non-palindromic variants only (palindromic -> NA -> dropped
    #    by the reader), the rule already used for fasting glucose.
    # Consequence: at most one MetaBrain instrument per gene (Wald ratio), and no
    # cis-window colocalisation with this source (needs the full file).
    tissue: cortex
    file: data/interim/mr/metabrain_cortex_eur_rank1_targets_grch37.tsv  # derived by src/mr/prepare_qtl_sources.py (see above)
    columns:
      SNP: rsid  # from MetaBrain's SNP id chr:pos:rsid:alleles
      chrom: chrom_grch37  # lifted from GRCh38 (src/mr/liftover.py)
      pos: pos_grch37  # lifted from GRCh38
      effect_allele: SNPEffectAllele  # browser table: allele the beta refers to
      other_allele: other_allele  # the other allele of SNPAlleles
      eaf: eaf_1000g_eur  # 1000G EUR frequency of the effect allele (see above)
      beta: MetaBeta  # browser table
      se: MetaSE  # browser table
      p: MetaP  # browser table
      "n": MetaPN  # browser table: meta-analysis sample size (key quoted, YAML 1.1)
      gene: GeneSymbol  # browser table
    # After liftover (the raw table is GRCh38).
    build: GRCh37
  pqtl_ukbppp:
    # Plasma cis-pQTLs: UK Biobank Pharma Proteomics Project, Sun et al. 2023
    # Nature 622:329 (doi 10.1038/s41586-023-06592-6), Olink Explore 3072.
    # Decision 2026-10-21 (option b). ACCESS: the full per-protein summary
    # statistics are on Synapse (syn51364943; the API answers "Anonymous users
    # have only READ access permission" to a download request, so a free Synapse
    # account is needed) and in a controlled-access AWS bucket - "needs the
    # researcher", not downloaded. What IS open (CC BY 4.0): Supplementary
    # Table 9 of the paper, every significant (p < 1.7e-11) primary pQTL of the
    # European-ancestry discovery cohort (n = 34,557) with A1, A1FREQ, BETA, SE,
    # log10(p), GRCh38 position and the GRCh37 position inside the variant id
    # (data/raw/mr/ukbppp_sun2023/41586_2023_6592_MOESM3_ESM.xlsx). Used as
    # follows (src/mr/prepare_qtl_sources.py): rows whose assay target is a
    # target gene; GRCh38 GENPOS lifted to GRCh37 with src/mr/liftover.py (drops
    # logged) and checked against the GRCh37 position in the variant id; p =
    # 10^-log10(p). One primary association per locus, so at most one cis
    # instrument per protein. Among the targets only ADRA2A, DBH and LGMN are on
    # the Olink panel (Supplementary Table 3); ADRA2A has no cis pQTL there.
    tissue: plasma
    file: data/interim/mr/ukbppp_discovery_st9_targets_grch37.tsv  # derived by src/mr/prepare_qtl_sources.py (see above)
    columns:
      SNP: rsID  # Supplementary Table 9
      chrom: chrom_grch37  # lifted from GENPOS (hg38)
      pos: pos_grch37  # lifted from GENPOS (hg38)
      effect_allele: A1  # ST9: "BETA (discovery, wrt. A1)"
      other_allele: A0  # ST9 variant id CHROM:GENPOS(hg37):A0:A1
      eaf: A1FREQ  # ST9: A1FREQ (discovery)
      beta: BETA  # ST9: BETA (discovery), SD units of NPX
      se: SE  # ST9: SE (discovery)
      p: P  # 10^-log10(p) (discovery)
      "n": N  # discovery cohort size 34,557 (Sun 2023, Results), per-protein N not given
      gene: Assay_Target  # ST9 column "Assay Target" (gene symbol), renamed without the space
    build: GRCh37  # after liftover from GRCh38 (checked against the hg37 position in the ST9 id)
  pqtl_decode:
    # Plasma cis-pQTLs: deCODE, Ferkingstad et al. 2021 Nat Genet 53:1712
    # (doi 10.1038/s41588-021-00978-w), SomaScan, 35,559 Icelanders. Decision
    # 2026-10-21 (option b). ACCESS: the summary statistics at
    # www.decode.com/summarydata need a form (name, e-mail, institution, accept
    # terms: scientific use only, no redistribution) with a reCAPTCHA - "needs
    # the researcher", not downloaded. The open supplement (Supplementary
    # Tables 2 and 8, CC BY 4.0) lists significant pQTLs with beta to 2 decimals
    # and no SE; among the targets it has cis pQTLs only for LGMN, which has no
    # positive control (untestable whatever the instrument). So no deCODE file is
    # built: null = "not run: exposure file not supplied".
    tissue: plasma
    file: null  # no open file usable for any testable target (see above)
    columns: null  # no file, so no column map
    build: null  # no file, so no build

# How a target's PRIMARY instrument source is chosen when several sources give
# instruments. Decided 2026-10-21, before any new-source positive control was
# run and before any Alzheimer's outcome row was read:
#  1. A source is eligible for a target only if its instruments pass that
#     target's positive-control gate (p < positive_control.p_max and the
#     expected sign) in the same window.
#  2. Among eligible sources, the first in this list is the primary source; the
#     others are reported as secondary analyses, never pooled.
#  3. Order and reason: plasma pQTL before brain eQTL before blood eQTL. A drug
#     acts on the protein, so protein abundance is one step closer to drug
#     action than mRNA; among transcript sources, cortex is the tissue of the
#     disease and of locus coeruleus projections, blood a convenience tissue.
#     UKB-PPP before deCODE: European ancestry like the outcome GWAS, full-
#     precision beta/SE/EAF in the open table, and antibody (Olink) assays are
#     less exposed to aptamer-binding artefacts than SomaScan.
#  4. The blood-only result (eQTLGen alone, the 2026-10-15 design) is always
#     reported alongside, labelled "option (a), blood only".
source_selection:
  hierarchy: [pqtl_ukbppp, pqtl_decode, metabrain, eqtlgen]  # order and reasons: points 2-3 above
  blood_only_source: eqtlgen  # option (a), point 4 above
  # Instrument orientation. eQTL instruments: effect allele = expression-
  # increasing allele; pQTL instruments: effect allele = protein-increasing
  # allele. The Wald ratio and IVW are invariant to which allele is coded, so
  # this fixes only the reporting: every estimate is per 1 SD higher genetically
  # predicted level of the source's measure (expression or protein), and the
  # expected signs in targets.*.positive_control and in prereg section 3 apply
  # unchanged to pQTL instruments.
  orientation: level_increasing_allele

instruments:
  # Genome-wide significance for cis instruments. A choice (brief left it
  # open): 5e-8 is the conservative convention; looser thresholds add weak
  # instruments and Module 1 already has F > 10 as a separate filter.
  p_max: 5.0e-8
  # Brief §5: minimum per-variant F statistic.
  f_stat_min: 10
  # Brief §5: minimum minor-allele frequency.
  maf_min: 0.01
  # Brief §5: LD clumping r^2 threshold (near-independent instruments).
  ld_r2_max: 0.001
  # Brief §5: LD clumping window, kb.
  ld_window_kb: 10000
  # PLINK binary fileset (without extension) of the LD reference panel. Data
  # step 2026-10-15: 1000 Genomes Phase 3 EUR (503 samples, GRCh37, bi-allelic
  # SNPs, rsIDs; 22,665,064 variants), the "European" reference of MAGMA
  # (cncr.nl/research/magma; g1000_eur.zip). Chosen because the MRC-IEU
  # 1kg.v3 file (fileserve.mrcieu.ac.uk) failed TLS (expired certificate) and
  # plain HTTP is refused by the proxy; this is the same 1000G Phase 3 EUR data.
  ld_reference_bfile: data/raw/mr/ld_1kg_eur/g1000_eur

coloc:
  # Brief §5: colocalisation supported if PP4 >= this.
  pp4_min: 0.8
  # Prior probability a variant is associated with trait 1 / trait 2
  # (coloc defaults, Giambartolomei 2014).
  p1: 1.0e-4
  # Same as p1.
  p2: 1.0e-4
  # Prior for a shared causal variant. 5e-6 rather than the coloc default
  # 1e-5, following Wallace 2020 (PLoS Genet) who showed 1e-5 is too permissive.
  p12: 5.0e-6
  # Prior SD of effect sizes (Wakefield ABF): 0.15 for a standardised
  # quantitative trait (eQTL), 0.2 for log-OR of a case-control trait — the
  # coloc package defaults.
  prior_sd_quantitative: 0.15
  # See prior_sd_quantitative.
  prior_sd_case_control: 0.2

# Sensitivity analysis: every target re-run with this cis window (eQTLGen's
# own cis definition is +/-1 Mb). Decided 2026-10-13; see window_kb above.
window_kb_sensitivity: 1000

positive_control:
  # A positive-control MR passes if p < this AND the sign matches expectation.
  # 0.05 is a choice: the control is a sanity check of instrument function,
  # not a discovery, so no multiple-testing correction.
  p_max: 0.05

# Gene-desert null test (tests/validation/targets/mr_null_gene_desert.yaml).
# Decided 2026-10-21 (researcher decision 3). The list is built by
# src/mr/gene_deserts.py from the files named here; it reads no outcome data.
# The null test itself reads the AD outcome, so it runs only after
# prereg/mr.md is frozen, and before any target's MR (prereg section 6).
gene_deserts:
  # Ovcharenko et al. 2005, Genome Res 15:137-145 (doi 10.1101/gr.3015505,
  # PMC540279), Results, "Identification of human gene deserts": gene deserts
  # are "The 3% longest intergenic intervals (545 genomic regions, with the
  # shortest of them covering 640 kb)" of the UCSC knownGenes annotation on
  # NCBI Build 34, "with subtelomeric and pericentromeric regions excluded".
  # So the definition is a percentile; 640 kb was its consequence on that
  # annotation. We apply the same percentile rule (data/extracted/mr_gene_desert_definition_ovcharenko2005.csv).
  longest_fraction: 0.03
  # GENCODE release 19 (GRCh37.p13): the last GENCODE release annotated
  # natively on GRCh37, the build of the pipeline (later "lift37" files are
  # mapped back from GRCh38). Downloaded 2026-10-21 from
  # https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_19/gencode.v19.annotation.gtf.gz
  annotation: GENCODE release 19 (GRCh37.p13), gene records
  annotation_file: data/raw/mr/gencode_v19/gencode.v19.annotation.gtf.gz  # local copy of the GENCODE 19 GTF (URL above)
  # Which gene records count as genes: protein-coding only, as in the paper's
  # definition ("devoid of protein-coding genes", abstract).
  gene_types: [protein_coding]
  # Autosomes only: the outcome GWAS and the LD panel analyses are autosomal.
  chromosomes: autosomes
  # Edge handling, following the paper's Methods: the genome is cut into
  # segments bounded by a chromosome end, a centromere, a telomere, a
  # heterochromatin or short-arm gap, or any assembly gap longer than
  # boundary_gap_min_bp; an intergenic interval must lie between two genes
  # inside one segment, so intervals that touch a segment boundary
  # (subtelomeric, pericentromeric, next to a large gap) are excluded. Smaller
  # gaps inside an interval are kept and counted in its length. Gene spans
  # that overlap are merged first. Gap table: NCBI GRCh37.p13
  # GCA_000001405.14_GRCh37.p13_genomic_gaps.txt.gz (UCSC's hg19 gap table was
  # unreachable on 2026-10-21: TLS chain failure; NCBI's is the source assembly).
  gaps_file: data/raw/mr/ncbi_grch37/GCA_000001405.14_GRCh37.p13_genomic_gaps.txt.gz
  assembly_report: data/raw/mr/ncbi_grch37/GCA_000001405.14_GRCh37.p13_assembly_report.txt  # GRCh37.p13 chromosome lengths (chromosome ends are segment boundaries)
  boundary_gap_types: [centromere, telomere, heterochromatin, short_arm]  # gap types that always end a segment (paper: telomere, centromere)
  boundary_gap_min_bp: 250000  # paper's Methods: an assembly gap of size >250 kb ends a segment
  # Variants for the null test, from the LD reference panel (1000G EUR,
  # instruments.ld_reference_bfile): bi-allelic SNVs with an rsID, MAF >=
  # instruments.maf_min, at least variant_margin_kb inside the desert from both
  # flanking genes (the primary cis window, so no variant falls in any gene's
  # +/-100 kb window), thinned to at least thin_bp apart, then LD-pruned to
  # r^2 < instruments.ld_r2_max within instruments.ld_window_kb (PLINK
  # --indep-pairwise), so draws are near-independent like clumped instruments.
  variant_margin_kb: 100
  thin_bp: 50000  # spacing before LD pruning, so pruning runs on a manageable set
  regions_file: data/interim/mr/gene_deserts/gene_deserts_grch37_gencode19_protein_coding.tsv  # output of src/mr/gene_deserts.py: one row per desert
  variants_file: data/interim/mr/gene_deserts/gene_desert_variants.csv  # output of src/mr/gene_deserts.py: the null test's variant list (SNP column)

# Pre-registered targets (brief §5 table). `predicted_lower_activity` is copied
# from the brief. Expression eQTLs are oriented to the expression-INCREASING
# allele, so "lower activity protective" means a POSITIVE MR estimate (higher
# expression -> higher AD risk); the code derives the expected sign.
# window_kb: cis window either side of the gene body. DECIDED 2026-10-13:
# +/-100 kb primary - most cis-eQTL/pQTL effects lie within 100 kb of the gene,
# and a narrow window keeps neighbouring genes' variants (pleiotropy) out; the
# eQTLGen cis definition (+/-1 Mb) is the sensitivity analysis
# (window_kb_sensitivity below). The brief asked for a per-target window, so
# each target can be changed individually.
# positive_control: outcome trait the instrument must move, with the expected
# sign of the MR estimate per higher expression, and the researcher-supplied
# summary statistics. A target with no positive control is EXCLUDED (the brief
# makes the control a hard gate) and the exclusion is logged.
targets:
  SLC6A2:
    # Noradrenaline transporter — atomoxetine.
    predicted_lower_activity: protective
    # Choice, see block comment above.
    window_kb: 100
    positive_control:
      # Decided 2026-10-13. NET inhibition (atomoxetine) raises heart rate, so lower SLC6A2 activity -> higher HR and higher expression -> LOWER HR (sign -1). The GWAS Catalog shows no genome-wide SLC6A2-heart-rate signal (manuscript/notes/mr_positive_controls.md), so this control may fail and exclude the target - that is the gate working.
      trait: resting_heart_rate
      # Expected sign of the MR estimate per HIGHER expression (see the comment above).
      expected_sign: -1
      # Data step 2026-10-15. Zhu et al. 2019 (PMID 30940143), UK Biobank
      # BOLT-LMM, mean resting heart rate, GWAS Catalog GCST007609 (GRCh37 per its
      # readme). Chosen: the only European resting-heart-rate GWAS with full
      # summary statistics on the GWAS Catalog on GRCh37 (the MVP heart-rate
      # files GCST90476338 etc. are larger-N but GRCh38; eQTLGen-era HRgene 2016
      # has no Catalog file). Cis-region subset by src/mr/prepare_inputs.py:
      # rsIDs from 1000G EUR (chr, pos, alleles), and the A1 frequency oriented
      # from the file's MAF with the 1000G EUR frequency (palindromic variants:
      # NA, dropped).
      file: data/interim/mr/positive_controls/resting_heart_rate_cisregions.tsv
      # Our names -> headers (GCST007609 readme.txt: A1 = effect allele, BETA in bpm).
      columns:
        SNP: rsid_mapped  # added by prepare_inputs.py
        chrom: chrom_grch37  # = CHR (hg19)
        pos: pos_grch37  # = BP (hg19)
        effect_allele: A1  # readme: effect allele
        other_allele: A0  # readme: reference allele
        eaf: eaf_oriented  # A1 frequency from MAF, see above
        beta: BETA  # readme: effect estimate
        se: SE  # readme
        p: P  # readme
      # Resting heart rate is quantitative.
      type: quantitative
      # GWAS Catalog REST API v2, GCST007609: "458,969 European ancestry individuals".
      "n": 458969
  ADRB1:
    # Beta-1 adrenergic receptor — lipophilic beta-blockers.
    predicted_lower_activity: protective
    # Choice, see block comment above.
    window_kb: 100
    positive_control:
      # Brief §6, Session 2 gate: the instrument must move resting heart rate.
