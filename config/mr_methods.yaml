# MR estimator and harmonisation settings shared by the validation test
# (tests/validation, Session 1) and Module 1 (Session 2), so the module runs
# with exactly the settings that were validated. Changing anything here
# invalidates the validation status (it is part of the code fingerprint).

# Seed for the weighted-median parametric bootstrap, the only random step.
seed: 20261013

# Two-sided confidence level for every reported interval; 95% is the
# convention in the MR literature we compare against.
ci_level: 0.95

harmonise:
  # Palindromic (A/T, C/G) variants are kept only if allele frequencies can
  # resolve the strand: both datasets' minor-allele frequency must be at most
  # this value. 0.42 is the TwoSampleMR default, chosen so our harmonisation
  # matches most published drug-target MR. Above it the strand is ambiguous
  # and the variant is dropped (and logged).
  palindrome_maf_max: 0.42

ivw:
  # Multiplicative random effects: SE = fixed-effect SE x max(1, residual SE).
  # Standard choice (Burgess 2017; TwoSampleMR mr_ivw); never shrinks the SE
  # below the fixed-effect SE when instruments are under-dispersed.
  model: multiplicative_random_effects

egger:
  # MR-Egger needs >= 3 variants to estimate slope and intercept with a
  # residual; fewer is reported as "not estimable", never computed.
  min_variants: 3

weighted_median:
  # Bowden et al. 2016 needs >= 3 variants for a median to differ from IVW.
  min_variants: 3
  # Parametric bootstrap replicates for the SE (Bowden 2016 used 1000).
  n_boot: 1000
  # Weights from second-order variance of the ratio (includes exposure SE),
  # as in Bowden 2016 / TwoSampleMR weighted_median.
  weights: second_order

crosscheck:
  # Pre-registered cross-check against TwoSampleMR (prereg/mr.md step 4),
  # tolerances decided 2026-10-14. The formulas are identical, so b, se, p, Q
  # and the Egger intercept may differ only by floating-point noise:
  abs_tol: 1.0e-10
  # Relative tolerance for the same quantities (the looser of the two applies).
  rel_tol: 1.0e-8
  # The weighted-median SE is a bootstrap SD, and TwoSampleMR draws its
  # bootstrap samples in a different order. With n_boot = 1000, each SD has a
  # relative Monte Carlo SE of about 1 / sqrt(2 * 999) = 2.2%, so the
  # difference of two independent ones is about 3.2%. 0.15 is about 4.7 such
  # SEs, so a false "disagree" has probability < 1e-5 per comparison. A real
  # formula difference (e.g. first- vs second-order weights) shows in the point
  # estimate, which must agree to rel_tol.
  wm_se_rel_tol: 0.15
wald_ratio:
  # First-order SE (se_out / |beta_exp|), as in TwoSampleMR mr_wald_ratio.
  # Ignores exposure uncertainty; acceptable when instruments are strong
  # (F > 10), which Module 1 enforces.
  se: first_order
