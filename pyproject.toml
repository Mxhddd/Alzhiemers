[project]
name = "lc-first"
version = "0.0.0"
description = "LC-First: a computational test of the locus coeruleus rate-controller hypothesis"
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Session 0 needs only config parsing and the plotting theme.
# Analysis dependencies (numpy, scipy, pymc, ...) are added in the session
# that first needs them, so every pin in uv.lock is justified by real code.
dependencies = [
    "pyyaml",
    "matplotlib",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "pandas>=3.0.6",
    "statsmodels>=0.15.0",
    "salib>=1.6.0",
    "jax[cpu]>=0.10.2",
    "numpyro>=0.22.0",
    "arviz>=0.23.4",
]

[dependency-groups]
dev = [
    "pytest",
    "sympy>=1.14.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "validation: reproduces a published result (tests/validation/)",
    "slow: takes minutes (MCMC); run by `make test-slow`, which `make all` includes",
]
