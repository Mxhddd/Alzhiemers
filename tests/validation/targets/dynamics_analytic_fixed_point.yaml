# Module 4 gate (brief §6, Session 5): the numerically found fixed point must
# match the analytic one.
#
# PROVENANCE, stated honestly: this fixed point was DERIVED BY CLAUDE, not by
# the researcher. It is MACHINE-CHECKED (exact rational arithmetic in sympy,
# manuscript/derivations/checks/module4_fixed_points.py, check A11; and the
# implementation, check C5) but NOT HUMAN-CHECKED. The brief asks for "an
# analytic fixed point I derive by hand"; until the researcher re-derives it
# (manuscript/derivations/module4_fixed_points.md §7, a few lines of algebra),
# this gate tests the code against Claude's derivation, not against an
# independent hand derivation.
id: dynamics_analytic_fixed_point
module: dynamics
kind: analytic_fixed_point_claude_derived_machine_checked
# Who derived it and how it was checked (see the header comment).
derived_by: "Claude (Anthropic), 2026-10-21; machine-checked, not human-checked"

# Parameter values of the derivation, chosen so every quantity is a small
# rational (all other parameters keep their config/dynamics_params.yaml value
# and do not enter: no drug is given, so eps and c0 do not affect the fixed point).
parameters: {kappa: 4.0, u0: 0.5, phi: 1.0, v: 1.0, m: 1.0, K: 0.125, q: 3.0, r_rep: 0.05, r_dam: 0.05, hA: 0.5, sigma: 8.0, eta: 2.0}
# The analytic fixed point: E = 1/2 (root of 2E^2 + E - 1 = 0), Y = 1/8,
# R = 1/2 (root of G), T = (1 + 8/8)(1 + 2/2)(3/2)/(1/2) = 12.
fixed_point: {E: 0.5, Y: 0.125, R: 0.5, T: 12.0}
# Stability: c3 = a11 a22 a33 - a13 a21 a32 = 3/10 - 3/80 = 21/80 > 0 and the
# T eigenvalue is -c0/2, so stable; it is the only fixed point because
# r_rep/r_dam + hA = 3/2 exceeds the bistability bound (q - 2)^2/(8q) = 1/24.
stability: stable
# The values are exact; 1e-8 allows for the root finder's convergence tolerance.
tolerance: 1.0e-8
