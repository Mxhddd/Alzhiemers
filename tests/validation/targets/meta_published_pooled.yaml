# Module 5 validation (brief §5): reproduce a published pooled estimate from
# the study-level numbers in the same paper. Values EXTRACTED BY CLAUDE from
# the open-access full text (verified: false until a human checks them):
# data/extracted/meta_validation_moraros2017.csv, with locators and verbatim
# snippets; citation in data/extracted/SOURCES.md.
id: meta_published_pooled
module: metaanalysis
kind: meta_published

published:
  citation: "Moraros J, Nwankwo C, Patten SB, Mousseau DD. The association of antidepressant drug usage with cognitive impairment or dementia, including Alzheimer disease: a systematic review and meta-analysis. Depress Anxiety 2017;34(3):217-226"
  doi: 10.1002/da.22584
  locator: "Results, pooled analyses, paragraph 1 (pooled OR); Table 3 (the five study ORs and weights)"
  # The paper says "random effects model" computed with Stata 'metan'; it does
  # not name the tau^2 estimator. metan's default is DerSimonian-Laird: an
  # ASSUMPTION about the software default, not a statement in the paper.
  method: DL
  # Knapp-Hartung is not mentioned (and is not metan's default).
  knapp_hartung: false
  # The pooled value is printed as an odds ratio.
  reported_as: ratio
  # Estimate, CI and level are read from the extracted file (role ma_pooled).
  ci_level: 0.95
  transcribed_by: Claude (machine extraction from Europe PMC full text PMC5347943; verified false)
  transcribed_on: 2026-10-13

inputs:
  # role ma_pooled (one row) + ma_component rows (the five studies).
  studies: data/extracted/meta_validation_moraros2017.csv
  provided_by: Claude extraction from the paper's Table 3 and Results text
