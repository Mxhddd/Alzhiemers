# Null validation for Module 1 (brief §5: "a null test using variants in no
# gene region"). Variants far from any gene should carry no drug-target
# signal, so MR "estimates" built on them must be null at the nominal rate.
#
# Design: draw `n_sets` random sets of `variants_per_set` gene-desert variants
# from the AD outcome GWAS; give each set a synthetic exposure (effect sizes
# drawn uniformly in [0.05, 0.2], SE 0.01 — generated in the test with the
# seed below, never stored); run IVW. Pass if the fraction of sets with
# p < alpha does not exceed the `pass_quantile` upper binomial quantile of
# alpha under the null (i.e. the type-I error is not inflated).
id: mr_null_gene_desert
module: mr
kind: null_test

settings:
  seed: 20261015        # fixed so the draw is reproducible
  n_sets: 1000          # enough to estimate a 5% rate to about +/-1.4%
  variants_per_set: 5   # typical cis-instrument count after clumping
  alpha: 0.05           # nominal type-I error
  pass_quantile: 0.99   # fail only if the excess is beyond the 99% binomial quantile

inputs:
  genome_build: GRCh37  # = config/mr_targets.yaml genome_build
  # Filled 2026-10-21 (researcher decision 3). One column, SNP, built by
  # src/mr/gene_deserts.py with the rule in config/mr_targets.yaml
  # `gene_deserts`: gene deserts as defined by Ovcharenko et al. 2005 (Genome
  # Res 15:137; the 3% longest intergenic intervals between protein-coding
  # genes, segments bounded by telomeres, centromeres and gaps > 250 kb), on
  # GENCODE release 19 / GRCh37; variants from the 1000G EUR LD panel, >= 100 kb
  # inside the desert, MAF >= 0.01, thinned and LD-pruned (r^2 < 0.001 within
  # 10 Mb). Provenance: the PROVENANCE.yaml written next to the file.
  # NOT RUN before the freeze: this test reads the AD outcome rows.
  desert_variants: data/interim/mr/gene_deserts/gene_desert_variants.csv
  provided_by: >-
    src/mr/gene_deserts.py (gene-desert variant list, from GENCODE 19, the
    NCBI GRCh37.p13 gap table and the 1000G EUR panel), plus the AD outcome
    file and column map configured in config/mr_targets.yaml after the freeze
